name: Neon Relay checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: neon-relay-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Relay and userscript checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Show tool versions
        run: |
          python --version
          node --version

      - name: Relay unit tests
        run: python -m unittest discover -s NeonRelay -p "test_*.py" -v

      - name: Userscript syntax check
        run: node --check ion-drift.user.js

      - name: Userscript tests
        run: node --test test-ion-drift.cjs